
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: triaje_ia
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "5432:5432"
    networks:
      - triaje-net

  n8n:
    image: n8nio/n8n
    environment:
      - N8N_DATABASE_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=triaje_ia
      - DB_POSTGRESDB_USER=postgres
      - DB_POSTGRESDB_PASSWORD=postgres
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=admin123
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./backend/n8n-workflows:/home/node/workflows
    depends_on:
      - postgres
    networks:
      - triaje-net

  streamlit:
    build:
      context: ./frontend/streamlit
      dockerfile: Dockerfile.streamlit
    ports:
      - "8501:8501"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=triaje_ia
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - USE_MOCK_IA=true
    depends_on:
      - postgres
    networks:
      - triaje-net

  api:
    build:
      context: ./api
      dockerfile: Dockerfile.api
    ports:
      - "5000:5000"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=triaje_ia
      - DB_USER=postgres
      - DB_PASSWORD=postgres
    depends_on:
      - postgres
    networks:
      - triaje-net

  react:
    build:
      context: ./frontend/react
      dockerfile: Dockerfile.react
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://api:5000
    depends_on:
      - api
    networks:
      - triaje-net

  mock-hce:
    build:
      context: ./backend/mock-hce
      dockerfile: Dockerfile.mock
    ports:
      - "5001:5001"
    networks:
      - triaje-net

volumes:
  postgres_data:
  n8n_data:

networks:
  triaje-net: